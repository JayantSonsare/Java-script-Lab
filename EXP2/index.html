<!DOCTYPE html>
<html>
<head>
    <title>Online Shopping Bill Calculator</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Segoe UI, Arial, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#0f172a,#1d4ed8,#38bdf8);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:30px;
        }

        .container{
            width:700px;
            background:#fff;
            border-radius:20px;
            padding:35px;
            box-shadow:0 15px 35px rgba(0,0,0,.3);
        }

        h1{
            text-align:center;
            color:#0f172a;
        }

        p{
            text-align:center;
            color:gray;
            margin-bottom:25px;
        }

        label{
            display:block;
            margin-top:15px;
            margin-bottom:8px;
            font-weight:bold;
            color:#1e293b;
        }

        input{
            width:100%;
            padding:14px;
            border:1px solid #cbd5e1;
            border-radius:10px;
            font-size:16px;
        }

        input:focus{
            outline:none;
            border-color:#2563eb;
            box-shadow:0 0 8px rgba(37,99,235,.4);
        }

        button{
            width:100%;
            padding:15px;
            margin-top:25px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:10px;
            font-size:18px;
            cursor:pointer;
        }

        button:hover{
            background:#1d4ed8;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:30px;
        }

        table,th,td{
            border:1px solid #d1d5db;
        }

        th{
            background:#2563eb;
            color:white;
            padding:12px;
        }

        td{
            padding:12px;
            text-align:center;
        }

        tr:nth-child(even){
            background:#f8fafc;
        }

        .footer{
            margin-top:35px;
            text-align:center;
            border-top:2px solid #ddd;
            padding-top:20px;
            color:#555;
        }

        .footer b{
            color:#1d4ed8;
        }

    </style>

</head>

<body>

<div class="container">

<h1>Online Shopping Bill Calculator</h1>

<p>Enter Product Details</p>

<label>Product Name</label>
<input type="text" id="product" placeholder="Enter Product Name">

<label>Price (₹)</label>
<input type="number" id="price" placeholder="Enter Price">

<label>Quantity</label>
<input type="number" id="quantity" placeholder="Enter Quantity">

<button onclick="calculateBill()">Calculate Bill</button>

<table id="billTable">

<tr>
<th>Product</th>
<th>Price</th>
<th>Quantity</th>
<th>Total Bill</th>
</tr>

<tr>
<td id="pName">-</td>
<td id="pPrice">-</td>
<td id="pQty">-</td>
<td id="totalBill">-</td>
</tr>

</table>

<div class="footer">
    <p><b>Developed By</b></p>
    <p><b>Jayant Sonsare</b></p>
    <p>PRN : <b>24070521058</b></p>
</div>

</div>

<script src="script.js"></script>

</body>
</html>
